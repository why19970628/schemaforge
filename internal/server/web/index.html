<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SchemaForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-theme="light">
  <aside class="rail">
    <div class="brand">
      <span class="mark">SF</span>
      <div>
        <strong>SchemaForge</strong>
        <small data-i18n="brandSub">schema cockpit</small>
      </div>
    </div>
    <nav>
      <p data-i18n="dataGroup">Data</p>
      <button class="active" data-mode="json-go"></button>
      <button data-mode="yaml-go"></button>
      <button data-mode="xml-json"></button>
      <p>SQL</p>
      <button data-mode="sql-ent"></button>
      <button data-mode="sql-gorm"></button>
      <button data-mode="sql-es"></button>
      <button data-mode="sql-mongo"></button>
    </nav>
  </aside>
  <main class="workspace">
    <header>
      <div>
        <h1 id="title">JSON to Go</h1>
        <span id="subtitle"></span>
      </div>
      <div class="actions">
        <button id="format-sql" class="hidden"></button>
        <button id="sample"></button>
        <button id="upload"></button>
        <button id="convert"></button>
        <button id="copy"></button>
        <button id="clear"></button>
        <input id="file-input" type="file" hidden>
      </div>
      <div class="switches" aria-label="Preferences">
        <button id="language">中文</button>
        <button id="theme">Dark</button>
      </div>
    </header>
    <section class="panes">
      <label class="pane">
        <span data-i18n="inputLabel">Input</span>
        <div class="editor">
          <pre id="input-highlight" aria-hidden="true"></pre>
          <textarea id="input" spellcheck="false"></textarea>
        </div>
      </label>
      <label class="pane output">
        <span data-i18n="outputLabel">Output</span>
        <div class="editor">
          <pre id="output-highlight" aria-hidden="true"></pre>
          <textarea id="output" spellcheck="false" readonly></textarea>
        </div>
      </label>
    </section>
    <footer id="status">Ready</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
