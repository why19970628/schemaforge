version: 2

project_name: schemaforge

builds:
  - main: ./cmd/schemaforge
    binary: schemaforge
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

brews:
  - name: schemaforge
    homepage: https://github.com/schemaforge/schemaforge
    description: CLI and local UI for converting structured text into schemas and Go code
    license: MIT
    repository:
      owner: schemaforge
      name: homebrew-tap
    install: |
      bin.install "schemaforge"
    test: |
      system "#{bin}/schemaforge", "version"
